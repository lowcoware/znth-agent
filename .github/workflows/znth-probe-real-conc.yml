name: znth probe real-conc
permissions:
  contents: read
  pull-requests: write
jobs:
  detect:
    name: Detect affected areas
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      python: ${{ steps.gate-lanes.outputs.python }}
      python_prod: ${{ steps.gate-lanes.outputs.python_prod }}
      frontend: ${{ steps.gate-lanes.outputs.frontend }}
      site: ${{ steps.gate-lanes.outputs.site }}
      scan: ${{ steps.gate-lanes.outputs.scan }}
      deps: ${{ steps.gate-lanes.outputs.deps }}
      uv_lock: ${{ steps.gate-lanes.outputs.uv_lock }}
      npm_lock: ${{ steps.gate-lanes.outputs.npm_lock }}
      bootstrap: ${{ steps.gate-lanes.outputs.bootstrap }}
      desktop_updater: ${{ steps.gate-lanes.outputs.desktop_updater }}
      rust: ${{ steps.gate-lanes.outputs.rust }}
      remote_backends: ${{ steps.gate-lanes.outputs.remote_backends }}
      docker_meta: ${{ steps.gate-lanes.outputs.docker_meta }}
      e2e: ${{ steps.gate-lanes.outputs.e2e }}
      e2e_upgrade: ${{ steps.gate-lanes.outputs.e2e_upgrade }}
      e2e_desktop_core: ${{ steps.gate-lanes.outputs.e2e_desktop_core }}
      e2e_desktop_update: ${{ steps.gate-lanes.outputs.e2e_desktop_update }}
      event_name: ${{ github.event_name }}
    steps:
    - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
    - name: Detect affected areas
      id: classify
      uses: ./.github/actions/detect-changes
      with:
        github-token: ${{ github.token }}
    - name: Force all lanes on release; E2E only on release or dispatch
      id: gate-lanes
      env:
        RELEASE: ${{ inputs.release }}
        EVENT_NAME: ${{ github.event_name }}
        CLASSIFIED: ${{ toJSON(steps.classify.outputs) }}
      run: "python3 - <<'PY'\nimport json, os\nvalues = json.loads(os.environ['CLASSIFIED'])\nrelease = os.environ['RELEASE'] == 'true'\ne2e_allowed = release or os.environ['EVENT_NAME'] == 'workflow_dispatch'\nwith open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:\n    for lane, value in values.items():\n        if lane.startswith('e2e') and not e2e_allowed:\n            value = 'false'\n        elif release and value in ('true', 'false'):\n            value = 'true'\n        if '\\n' in value or '\\r' in value:\n            continue\n        output.write(f'{lane}={value}\\n')\nPY\n"
    if: 'false'
  tests:
    name: Python tests
    needs: detect
    if: 'false'
    uses: ./.github/workflows/tests.yml
    with:
      e2e: ${{ needs.detect.outputs.e2e == 'true' }}
      e2e_upgrade: ${{ needs.detect.outputs.e2e_upgrade == 'true' }}
      strict_acceptance: ${{ inputs.strict_acceptance || '' }}
  tests-os:
    name: OS-specific tests
    needs: detect
    if: 'false'
    uses: ./.github/workflows/tests-os.yml
    with:
      desktop_updater: ${{ needs.detect.outputs.desktop_updater == 'true' }}
      e2e: ${{ needs.detect.outputs.e2e == 'true' }}
      e2e_upgrade: ${{ needs.detect.outputs.e2e_upgrade == 'true' }}
      strict_acceptance: ${{ inputs.strict_acceptance || '' }}
  lint:
    name: Python lints
    needs: detect
    if: 'false'
    uses: ./.github/workflows/lint.yml
    with:
      event_name: ${{ needs.detect.outputs.event_name }}
      python: ${{ needs.detect.outputs.python == 'true' }}
  js-tests:
    name: JS & TS checks
    needs: detect
    if: 'false'
    uses: ./.github/workflows/js-tests.yml
  rust-tests:
    name: Rust tests
    needs: detect
    if: 'false'
    uses: ./.github/workflows/rust-tests.yml
  remote-backends:
    name: Remote terminal backends
    needs: detect
    if: 'false'
    uses: ./.github/workflows/remote-backends.yml
  bootstrap-installer:
    name: Bootstrap installer
    needs: detect
    if: 'false'
    uses: ./.github/workflows/bootstrap-installer.yml
  e2e-desktop:
    name: Desktop E2E
    needs: detect
    if: 'false'
    uses: ./.github/workflows/e2e-desktop.yml
  e2e-desktop-core:
    name: Desktop core E2E
    needs: detect
    if: 'false'
    uses: ./.github/workflows/e2e-desktop-core.yml
  e2e-desktop-update:
    name: Desktop update E2E
    needs: detect
    if: 'false'
    uses: ./.github/workflows/e2e-desktop-update.yml
  docs-site:
    name: Docs Site
    needs: detect
    if: 'false'
    uses: ./.github/workflows/docs-site-checks.yml
  history-check:
    name: Deny unrelated histories
    needs: detect
    if: 'false'
    uses: ./.github/workflows/history-check.yml
  contributor-check:
    name: Check contributors
    needs: detect
    if: 'false'
    uses: ./.github/workflows/contributor-check.yml
  uv-lockfile:
    name: Check uv.lock
    needs: detect
    if: 'false'
    uses: ./.github/workflows/uv-lockfile-check.yml
  infographic-check:
    name: Check no committed infographics
    needs: detect
    uses: ./.github/workflows/infographic-check.yml
    if: 'false'
  profile-artifact-check:
    name: Profile artifact check
    needs: detect
    uses: ./.github/workflows/profile-artifact-check.yml
    if: 'false'
  icons-freshness-check:
    name: Icon assets freshness
    needs: detect
    uses: ./.github/workflows/icons-freshness-check.yml
    if: 'false'
  case-collision-check:
    name: Check no case-colliding filenames
    needs: detect
    uses: ./.github/workflows/case-collision-check.yml
    if: 'false'
  blob-size-check:
    name: Check no large binaries
    needs: detect
    uses: ./.github/workflows/blob-size-check.yml
    if: 'false'
  lazy-deps-guard:
    name: No production imports of the tools.lazy_deps stub
    needs: detect
    uses: ./.github/workflows/lazy-deps-guard.yml
    if: 'false'
  lockfile-diff:
    name: package-lock.json diff
    needs: detect
    if: 'false'
    uses: ./.github/workflows/lockfile-diff.yml
  prompt-surface-diff:
    name: Prompt surface diff
    needs: detect
    if: 'false'
    uses: ./.github/workflows/prompt-surface-diff.yml
  docker-lint:
    name: Lint Docker scripts
    needs: detect
    if: 'false'
    uses: ./.github/workflows/docker-lint.yml
  supply-chain:
    name: Supply-chain scan
    needs: detect
    if: 'false'
    uses: ./.github/workflows/supply-chain-audit.yml
    with:
      event_name: ${{ needs.detect.outputs.event_name }}
      scan: ${{ needs.detect.outputs.scan == 'true' }}
      deps: ${{ needs.detect.outputs.deps == 'true' }}
  all-checks-pass:
    name: All required checks pass (v2)
    needs:
    - detect
    - tests
    - tests-os
    - lint
    - js-tests
    - rust-tests
    - remote-backends
    - bootstrap-installer
    - e2e-desktop
    - e2e-desktop-core
    - e2e-desktop-update
    - docs-site
    - history-check
    - contributor-check
    - uv-lockfile
    - infographic-check
    - case-collision-check
    - blob-size-check
    - lazy-deps-guard
    - lockfile-diff
    - prompt-surface-diff
    - docker-lint
    - profile-artifact-check
    - icons-freshness-check
    - supply-chain
    if: 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      needs-json: ${{ steps.evaluate.outputs.needs-json }}
    steps:
    - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      with:
        ref: ${{ github.sha }}
    - name: Evaluate job results
      id: evaluate
      env:
        NEEDS: ${{ toJSON(needs) }}
        RELEASE: ${{ inputs.release }}
      run: 'args=()

        if [ "$RELEASE" = true ]; then args+=(--release); fi

        printf ''%s'' "$NEEDS" | python3 scripts/ci/required_results.py "${args[@]}"

        '
  ci-timings:
    name: CI timing report
    needs:
    - all-checks-pass
    if: 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout code
      uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
    - name: Restore baseline cache (PR only)
      if: github.event_name == 'pull_request'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ci-timings-baseline.json
        key: ci-timings-baseline-never-exact
        restore-keys: 'ci-timings-baseline-

          '
    - name: Collect timings and generate report
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: "python3 scripts/ci/timings_report.py \\\n  --baseline ci-timings-baseline.json \\\n  --output ci-timings-report.html \\\n  --json-out ci-timings.json \\\n  --summary-out ci-timings-summary.md\n"
    - name: Upload HTML report
      continue-on-error: true
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      id: ci-timings-html
      with:
        name: ci-timings-report
        path: ci-timings-report.html
        retention-days: 14
    - name: Build linked review status
      if: hashFiles('ci-timings.json') != ''
      env:
        CI_TIMINGS_REPORT_URL: ${{ steps.ci-timings-html.outputs.artifact-url }}
      run: "python3 scripts/ci/timings_report.py \\\n  --from-json ci-timings.json \\\n  --baseline ci-timings-baseline.json \\\n  --review-status-out review-status.json \\\n  --review-status-only\n"
    - name: Upload review status
      if: hashFiles('review-status.json') != ''
      continue-on-error: true
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: review-status-ci-timings
        path: review-status.json
        retention-days: 14
    - name: Output summary
      env:
        REPORT_URL: ${{ steps.ci-timings-html.outputs.artifact-url}}
      run: "{\n  echo \"# CI Timing report\"\n  echo \"[View the full interactive report]($REPORT_URL)\"\n} >> \"$GITHUB_STEP_SUMMARY\"\ncat ci-timings-summary.md >> \"$GITHUB_STEP_SUMMARY\"\n"
    - name: Save baseline cache (main only)
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: "# Degraded runs (API rate-limited) produce no ci-timings.json —\n# skip rather than fail, and never cache an empty baseline.\nif [ -f ci-timings.json ]; then\n  cp ci-timings.json ci-timings-baseline.json\nelse\n  echo \"No timings JSON this run — skipping baseline update\"\nfi\n"
    - name: Upload baseline to cache (main only)
      if: github.event_name == 'push' && github.ref == 'refs/heads/main' && hashFiles('ci-timings-baseline.json') != ''
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ci-timings-baseline.json
        key: ci-timings-baseline-${{ github.run_id }}
on:
  push:
    branches:
    - main
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || (github.event_name == 'workflow_call' && github.run_id) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
